# Models mapping configuration for quick toggling
models:
  # Base single-stage model (Super Fast)
  yolo11n_pose:
    type: 'yolo'
    weights: 'yolo11n-pose.pt'  # Will auto-download
    config: null

  # Recommended top-down lightweight model (Fast & Accurate)
  rtmpose_m:
    type: 'mmpose'
    weights: 'https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/rtmpose-m_simcc-body7_pt-body7_420e-256x192-e48f03d0_20230504.pth'
    config: 'rtmpose-m_8xb256-420e_coco-256x192'

  # Heavy Vision Transformer model (Slow & Highly Accurate - E1 only)
  vitpose_b:
    type: 'mmpose'
    weights: 'https://download.openmmlab.com/mmpose/v1/body_2d_keypoint/topdown_heatmap/coco/td-hm_vitpose-base-simple_8xb64-210e_coco-256x192-232ccde5_20221104.pth'
    config: 'td-hm_vitpose-base-simple_8xb64-210e_coco-256x192'

  # Light top-down
  rtmpose_s:
    type: 'mmpose'
    weights: 'https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/rtmpose-s_simcc-body7_pt-body7_420e-256x192-acd4a1ef_20230504.pth'
    config: 'rtmpose-s_8xb256-420e_coco-256x192'
